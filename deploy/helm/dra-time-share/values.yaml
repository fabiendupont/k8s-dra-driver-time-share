nameOverride: ""
fullnameOverride: ""

driverName: "time-share.fabiendupont.io"

driver:
  image:
    repository: quay.io/fabiendupont/dra-time-share
    pullPolicy: IfNotPresent
    tag: ""
  imagePullSecrets: []

  cores: "0,1,2,3"
  periodMs: 1
  slotCount: 4
  healthPort: 8080

  serviceAccount:
    create: true
    annotations: {}
    name: ""

  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 512Mi

  nodeSelector:
    time-share.fabiendupont.io/sched-deadline: "true"
  tolerations: []
  affinity: {}
  podLabels: {}
  podAnnotations: {}

nfd:
  enabled: true

topologyRule:
  enabled: false
