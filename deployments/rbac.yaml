apiVersion: v1
kind: Namespace
metadata:
  name: dra-time-share
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dra-time-share
  namespace: dra-time-share
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dra-time-share
rules:
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceslices"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dra-time-share
subjects:
  - kind: ServiceAccount
    name: dra-time-share
    namespace: dra-time-share
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dra-time-share
