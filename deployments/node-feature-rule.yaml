apiVersion: nfd.k8s-sigs.io/v1alpha1
kind: NodeFeatureRule
metadata:
  name: sched-deadline-capable
spec:
  rules:
    - name: sched-deadline
      labels:
        time-share.fabiendupont.io/sched-deadline: "true"
      matchFeatures:
        - feature: kernel.config
          matchExpressions:
            RT_GROUP_SCHED:
              op: DoesNotExist
