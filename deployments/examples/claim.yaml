apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: my-time-slot
spec:
  devices:
    requests:
      - name: slot
        exactly:
          deviceClassName: time-share-slots
          selectors:
            - cel:
                expression: "device.attributes['time-share.fabiendupont.io'].utilizationMillis >= 250"
