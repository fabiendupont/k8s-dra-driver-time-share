apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dra-time-share
  namespace: dra-time-share
spec:
  selector:
    matchLabels:
      app: dra-time-share
  template:
    metadata:
      labels:
        app: dra-time-share
    spec:
      serviceAccountName: dra-time-share
      nodeSelector:
        time-share.fabiendupont.io/sched-deadline: "true"
      containers:
        - name: driver
          image: quay.io/fabiendupont/dra-time-share:latest
          args:
            - --node-name=$(NODE_NAME)
            - --cores=0,1,2,3
            - --period-ms=1
            - --slot-count=4
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 512Mi
          securityContext:
            privileged: true
          volumeMounts:
            - name: kubelet-plugins
              mountPath: /var/lib/kubelet/plugins
            - name: kubelet-plugins-registry
              mountPath: /var/lib/kubelet/plugins_registry
            - name: cdi
              mountPath: /var/run/cdi
      volumes:
        - name: kubelet-plugins
          hostPath:
            path: /var/lib/kubelet/plugins
        - name: kubelet-plugins-registry
          hostPath:
            path: /var/lib/kubelet/plugins_registry
        - name: cdi
          hostPath:
            path: /var/run/cdi
            type: DirectoryOrCreate
